<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e11d48'/><path d='M25 75 L25 25 L50 25 C65 25 75 35 75 50 C75 65 65 75 50 75 Z' fill='none' stroke='white' stroke-width='10' stroke-linecap='round'/><circle cx='50' cy='50' r='10' fill='white'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoReadPost | Stories of Founders, AI &amp; The Startup Ecosystem</title>
    <meta name="description" content="GoReadPost is the premier digital journalism platform chronicling high-impact founders, breakthrough deep tech, venture capital, and economic innovation." />
    <meta name="keywords" content="startups, venture capital, AI, technology news, entrepreneurship, deeptech, fintech, founder stories" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,600&family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('goreadpost_site_settings') || '{}');
        if (s && s.siteTitle) {
          document.title = s.siteTagline ? (s.siteTitle + ' | ' + s.siteTagline) : s.siteTitle;
        }
        const fav = s.favicon || s.faviconUrl || s.logo;
        if (fav) {
          const l = document.querySelector("link[rel*='icon']");
          if (l) l.href = fav;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
